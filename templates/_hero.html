<header class="hero-card {% if hero_variant == 'landing' %}landing-hero-card{% else %}compact-hero{% endif %}" aria-labelledby="{{ hero_id | default('page-hero-title') }}">
    <div class="hero-image-wrap {% if hero_variant != 'landing' %}compact-logo-wrap{% endif %}">
        <img
            src="{{ url_for('static', filename='images/heart_logo.png') }}"
            alt="HerSignal logo"
            class="hero-logo"
            decoding="async"
        >
    </div>
    <div class="hero-text {% if hero_variant != 'landing' %}compact-hero-text{% endif %}">
        <h1 id="{{ hero_id | default('page-hero-title') }}">{{ hero_title | default('HerSignal') }}</h1>
        {% if hero_subtitle %}
        <p class="hero-subtitle">{{ hero_subtitle }}</p>
        {% endif %}
        {% if hero_variant == 'landing' %}
        <div class="hero-actions btn-row btn-row--center">
            <a href="{{ url_for('symptoms_page') }}" class="primary-btn hs-btn-lift">Start symptom checker</a>
            {% if is_logged_in %}
            <a href="{{ url_for('my_insights') }}" class="secondary-btn hs-btn-lift">Open insights</a>
            {% else %}
            <a href="{{ url_for('auth.login', next=url_for('my_insights')) }}" class="secondary-btn hs-btn-lift">Open insights</a>
            {% endif %}
        </div>
        {% endif %}
    </div>
</header>
