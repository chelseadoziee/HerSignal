<div id="insight-story-modal" class="insight-story-modal" hidden role="dialog" aria-modal="true" aria-labelledby="insight-story-title">
    <div class="insight-story-backdrop" data-close-story></div>
    <div class="insight-story-panel glow-card">
        <button type="button" class="insight-story-close" data-close-story aria-label="Close insight story">×</button>
        <p class="insight-story-kicker">Private insight story</p>
        <h2 id="insight-story-title" class="insight-story-slide-title"></h2>
        <p class="insight-story-slide-body"></p>
        <div class="insight-story-dots" role="tablist" aria-label="Story slides"></div>
        <div class="insight-story-nav">
            <button type="button" class="secondary-btn" id="insight-story-prev">Back</button>
            <button type="button" class="primary-btn animated-cta" id="insight-story-next">Next</button>
        </div>
        <p class="insight-story-foot text-caption">For your reflection only. Not for sharing medical details publicly.</p>
    </div>
</div>
